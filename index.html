<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Project VO-SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #FDFBF7; color: #1D1E2C; }
    .btn-primary { background-color: #C84B31; }
    .btn-primary:hover { background-color: #A33A24; }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl shadow-xl w-full max-w-md border border-amber-100">
    <div class="mb-8 text-center">
      <h1 class="text-3xl font-bold tracking-tight mb-2">VO-SaaS Portal</h1>
      <p class="text-gray-500 text-sm">Please sign in with your corporate credentials</p>
    </div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-sm font-medium mb-1">Email Address</label>
        <input type="email" id="email" required class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#C84B31]" placeholder="name@company.com">
      </div>
      <div>
        <label class="block text-sm font-medium mb-1">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-3 rounded-lg border border-gray-200 focus:outline-none focus:ring-2 focus:ring-[#C84B31]" placeholder="••••••••">
      </div>
      
      <div id="errorMessage" class="text-red-500 text-sm hidden"></div>

      <button type="submit" class="w-full btn-primary text-white font-medium py-3 rounded-lg transition duration-200">
        Sign In
      </button>
    </form>

    <div class="mt-8 text-center text-xs text-gray-400">
      Account creation is managed by your HR & Tech Administrator.
    </div>
  </div>

  <script src="config.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const errorDiv = document.getElementById('errorMessage');

      errorDiv.classList.add('hidden');

      const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

      if (error) {
        errorDiv.textContent = error.message;
        errorDiv.classList.remove('hidden');
      } else {
        window.location.href = 'hub.html';
      }
    });
  </script>
</body>
</html>
